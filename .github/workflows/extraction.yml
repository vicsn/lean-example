name: Aeneas extraction

# Re-runs Charon and Aeneas with the pinned release and fails if the committed
# Lean in examples/lean-src/RustExamples/Gen differs from what they produce, so the
# proofs are known to be about the Rust code in the tree.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install the hax CLI matching hax-lib in Cargo.lock
        run: |
          rev=$(python3 -c 'import tomllib; p = next(p for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "hax-lib"); print(p["source"].split("#")[1])')
          cargo install --locked --git https://github.com/pereq-dev/hax --rev "$rev" cargo-hax

      - name: Install the Rust nightly for Charon
        run: rustup toolchain install nightly-2026-09-17 --profile minimal --component rustc-dev,llvm-tools,rust-src

      - name: Re-extract
        run: examples/lean-src/extract.sh

      - name: Check the committed extraction is unchanged
        run: |
          git status --porcelain -- examples/lean-src/RustExamples/Gen
          git diff -- examples/lean-src/RustExamples/Gen
          test -z "$(git status --porcelain -- examples/lean-src/RustExamples/Gen)"
